<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/jpeg"
      href="./assets/images/profile-transparent.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daniel Melese | Full Stack Developer & Founder</title>
    <meta
      name="description"
      content="Portfolio of Daniel Melese - Full Stack Web Developer specializing in React.js, Next.js, TypeScript, Three.js, Laravel, and DevOps."
    />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Permanent Google Translate banner suppression */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      .VIpgJd-ZVi9od-ORHb-OEVmcd,
      .VIpgJd-ZVi9od-ORHb-OEVmcd-ti6hGc,
      .VIpgJd-ZVi9od-l4eHX-hSRGPd,
      .VIpgJd-yAWNEb-L7lbkb,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf,
      .VIpgJd-ZVi9od-aZ2wEe-wOHMyf-ti6hGc,
      .VIpgJd-ZVi9od-SmfZ-Ovfdao,
      iframe[id^=":"]:not([id*="canvas"]),
      iframe[class*="goog-te-banner-frame"],
      iframe[class*="VIpgJd"],
      #goog-gt-tt,
      #goog-gt-vt,
      .goog-te-balloon-frame,
      .goog-tooltip,
      .goog-tooltip:hover {
        display: none !important;
        visibility: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
        height: 0 !important;
        width: 0 !important;
        border: none !important;
        opacity: 0 !important;
        pointer-events: none !important;
        position: absolute !important;
        left: -9999px !important;
        top: -9999px !important;
      }

      html {
        top: 0px !important;
        margin-top: 0px !important;
        padding-top: 0px !important;
      }

      body {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
        padding-top: 0px !important;
      }

      .goog-text-highlight {
        background: none !important;
        background-color: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }

      .goog-te-gadget {
        display: none !important;
      }
    </style>
  </head>
  <body
    class="bg-slate-950 text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-cyan-500 selection:text-slate-950"
  >
    <div id="root"></div>

    <!-- Hidden Google Translate Element -->
    <div id="google_translate_element" style="display:none; visibility:hidden; height:0; width:0; overflow:hidden;"></div>

    <!-- Google Translate Script Loader -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement(
            {
              pageLanguage: 'en',
              includedLanguages: 'en,am,om,fr,ar,es',
              autoDisplay: false
            },
            'google_translate_element'
          );
        }
      }

      // Continuously enforce body top: 0px and hide translation banner
      (function() {
        var fixGoogleTranslateUI = function() {
          if (document.body) {
            if (document.body.style.top && document.body.style.top !== '0px') {
              document.body.style.top = '0px';
            }
            if (document.body.style.position && document.body.style.position !== 'static') {
              document.body.style.position = 'static';
            }
          }
          var banners = document.querySelectorAll(
            '.VIpgJd-ZVi9od-ORHb-OEVmcd, .goog-te-banner-frame, iframe.skiptranslate, iframe[id^=":"]'
          );
          for (var i = 0; i < banners.length; i++) {
            banners[i].style.display = 'none';
            banners[i].style.visibility = 'hidden';
            banners[i].style.height = '0px';
          }
        };

        if (window.MutationObserver) {
          var observer = new MutationObserver(fixGoogleTranslateUI);
          window.addEventListener('DOMContentLoaded', function() {
            observer.observe(document.body, { attributes: true, attributeFilter: ['style'], childList: true });
          });
        }
        setInterval(fixGoogleTranslateUI, 200);
      })();
    </script>
    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
      async
      defer
    ></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
